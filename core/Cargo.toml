[package]
name = "valser-core"
version = "1.0.2"
edition = "2024"

[package.metadata.release]
tag = false

[dependencies]
rand = "0.10.1"
walkdir = "2.5.0"
lofty = "0.24.0"
redb = "4.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rodio = { version = "0.22.2", default-features = false, features = [
    "playback",
    "symphonia-all",
    "symphonia-ogg",
    "symphonia-mkv",
] }
symphonia = { version = "0.5", default-features = false, features = ["ogg"] }
symphonia-adapter-libopus = "0.2"

# Opus NEON detection does not build with clang-cl on Windows arm64
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
opusic-sys = { version = "0.7.3", features = ["no-simd"] }
