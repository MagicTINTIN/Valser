[package]
name = "valser-android"
version = "0.1.0"
edition = "2021"

# Must be cdylib for Android
[lib]
name = "valser_android"
crate-type = ["cdylib"]

[dependencies]
valser = { path = "../valser" }
bevy = { version = "0.18.1", default-features = false, features = ["android-native-activity"] }# ["android-game-activity"] } # "android-native-activity"

[package.metadata.android]
package = "fr.magictintin.valser"
label = "Valser"
# Minimum Android API 28 (required by Oboe/cpal)
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
launch_mode = "singleTask"


[package.metadata.android.signing.release]
path = "/home/user/.android/valser-release.keystore"
keystore_password = "the_password_here"
alias = "valser"
key_password = "the_password_here"