# version = "*"
# default-features = false
# features = ["playback", "symphonia-all", "cpal-shared-stdcxx"]

# [target.'cfg(not(target_os = "android"))'.dependencies.rodio]
# version = "*"
# default-features = false
# features = ["playback", "symphonia-all"]



[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.1"
mpris-server = "0.10.0"
smol = "2.0.2"
futures = "0.3.32"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

